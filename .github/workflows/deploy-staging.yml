name: Deploy staging

# Manual, separate staging release. This targets cuet-astro-staging and the
# cuet-d1-staging database only; production cuet-astro/cuet-blueprint-db is
# never touched. Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID first.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type "deploy-staging" to run the staging import and deploy
        required: true
        type: string
      staging_url:
        description: Staging URL used for the smoke check
        required: true
        default: https://cuet-astro-staging.cuet-platform.workers.dev
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Staging D1 import, deploy and smoke
    runs-on: ubuntu-latest
    # `release/*` lets a release candidate reach staging before it is merged to
    # main. Production deploys never run from this workflow.
    if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')) && github.repository == 'FoXDev-404/cuet'
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      STAGING_URL: ${{ inputs.staging_url }}
    steps:
      - name: Confirm staging deployment
        run: |
          if [ "${{ inputs.confirm }}" != "deploy-staging" ]; then
            echo "::error::Type 'deploy-staging' in the confirm input."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Check Cloudflare credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets first."
            exit 1
          fi
      - name: Install dependencies
        run: npm ci
      - name: Apply staging migrations
        run: npm run db:migrate:staging
      - name: Import staging practice papers
        run: npm run db:import:practice:staging
      - name: Import staging ranked mocks
        run: npm run db:import:ranked-practice:staging
      - name: Classify staging explanation provenance
        run: npm run backfill:staging
      - name: Build and deploy staging
        run: npm run deploy:staging
      - name: Smoke test staging
        run: node scripts/smoke-check.mjs "$STAGING_URL" --expect "137 papers"
