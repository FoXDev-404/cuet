name: Auto deploy production

# Push-to-main code deploys: build with the production environment and upload
# the worker. This workflow deliberately does NOT touch D1 (it needs only the
# "Edit Cloudflare Workers" token scope). When a migration lands, apply it via
# the guarded "Deploy production" workflow or `npm run db:migrate:remote`
# before or right after the deploy.
#
# Requires CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets.
# A commit subject containing [skip deploy] skips the deploy.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy code to production
    runs-on: ubuntu-latest
    if: github.repository == 'FoXDev-404/cuet'
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Check Cloudflare credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets first (Settings → Secrets and variables → Actions)."
            exit 1
          fi
      - name: Check for skip marker
        id: skip
        run: |
          if git log -1 --pretty=%s | grep -qi "\[skip deploy\]"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Commit message contains [skip deploy] — skipping the deploy."
          fi
      - name: Install dependencies
        if: steps.skip.outputs.skip != 'true'
        run: npm ci
      - name: Build and deploy
        if: steps.skip.outputs.skip != 'true'
        run: npm run deploy
      - name: Smoke test production
        if: steps.skip.outputs.skip != 'true'
        run: |
          set -euo pipefail
          # The new worker version takes a few seconds to propagate across the
          # edge, so each path is retried before the deploy is judged.
          check_path() {
            for attempt in 1 2 3; do
              code=$(curl -s -o /dev/null -w "%{http_code}" "https://cuetfreemocktest.com$1")
              echo "$1 (attempt $attempt) -> $code"
              if [ "$code" = "200" ]; then return 0; fi
              sleep 10
            done
            echo "::error::$1 never returned 200 after the deploy."
            return 1
          }
          sleep 15
          check_path "/api/health"
          check_path "/mock-tests"
          check_path "/sitemap.xml"
          echo "Auto-deploy smoke passed."
