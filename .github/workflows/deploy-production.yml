name: Deploy production

# Manual, guarded release of the code plus the committed practice library.
# Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as repository secrets
# before dispatching. The job never runs on a normal push.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type "deploy" to run remote migrations, content import and deploy
        required: true
        type: string
      production_url:
        description: Production Worker URL used for the smoke check
        required: false
        default: https://cuet-astro.cuet-platform.workers.dev
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Remote D1 import, deploy and smoke
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PRODUCTION_URL: ${{ inputs.production_url }}
    steps:
      - name: Confirm deployment
        run: |
          if [ "${{ inputs.confirm }}" != "deploy" ]; then
            echo "::error::Type 'deploy' in the confirm input to run this job."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Check Cloudflare credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets first."
            exit 1
          fi
      - name: Install dependencies
        run: npm ci
      - name: Apply remote migrations
        run: npx wrangler d1 migrations apply cuet-blueprint-db --remote
      - name: Import practice papers
        run: node scripts/import-practice-library.mjs --remote
      - name: Import ranked mocks
        run: node scripts/import-ranked-practice.mjs --remote
      - name: Classify explanation provenance
        run: node scripts/backfill-explanation-provenance.mjs --remote
      - name: Build and deploy
        run: npm run deploy
      - name: Smoke test production
        run: |
          set -euo pipefail
          for path in /api/health /mock-tests /sitemap.xml /mock/psychology-2024-07-19-shift-1/instructions; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$PRODUCTION_URL$path")
            echo "$path -> $code"
            test "$code" = "200"
          done
          curl -fsS "$PRODUCTION_URL/mock-tests" | grep -q "245 papers"
          echo "Production smoke passed."
