name: CI Quality Gate

on:
  push:
    branches: [main, fix/*, feat/*, release/*]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Environment Separation & Guard Policy Check
        run: npm run check:env

      - name: Copy & Editorial Policy Lint
        run: npm run lint:copy

      - name: Astro Type Check
        run: npx astro check

      - name: Unit & Integration Tests
        run: npm test

      - name: Production Build
        run: npm run build

      - name: SEO Consistency & Sitemap Audit
        run: npm run seo:check

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Playwright E2E Tests
        run: npm run test:e2e

      - name: Accessibility (WCAG A/AA) Audit
        run: npm run test:a11y
        env:
          A11Y_SKIP_ATTEMPT: "0"

      - name: Upload Playwright Test Results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts-${{ github.run_id }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7
