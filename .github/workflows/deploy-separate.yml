name: Deploy separate 2026 site

# Manual release of the independent cuet-2026 Worker and cuet-2026-db database.
# This is separate from both cuet-astro production and cuet-astro-staging.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type "deploy-2026" to run the separate deployment
        required: true
        type: string
      site_url:
        description: Separate deployment URL for the smoke check
        required: false
        default: https://cuet-2026.rajpal010304.workers.dev
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-2026
  cancel-in-progress: false

jobs:
  deploy:
    name: cuet-2026 D1 import, deploy and smoke
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SITE_URL: ${{ inputs.site_url }}
    steps:
      - name: Confirm separate deployment
        run: |
          if [ "${{ inputs.confirm }}" != "deploy-2026" ]; then
            echo "::error::Type 'deploy-2026' in the confirm input."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Check Cloudflare credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets first."
            exit 1
          fi
      - name: Install dependencies
        run: npm ci
      - name: Apply cuet-2026 migrations
        run: npm run db:migrate:2026
      - name: Import cuet-2026 practice papers
        run: npm run db:import:practice:2026
      - name: Import cuet-2026 ranked mocks
        run: npm run db:import:ranked-practice:2026
      - name: Classify cuet-2026 explanation provenance
        run: npm run backfill:2026
      - name: Build and deploy cuet-2026
        run: npm run deploy:2026
      - name: Smoke test cuet-2026
        run: |
          set -euo pipefail
          for path in /api/health /mock-tests /sitemap.xml /mock/psychology-2024-07-19-shift-1/instructions; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$SITE_URL$path")
            echo "$path -> $code"
            test "$code" = "200"
          done
          curl -fsS "$SITE_URL/mock-tests" | grep -q "245 papers"
          echo "Separate deployment smoke passed."
