name: D1 backup

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Check backup configuration
        id: config
        working-directory: .
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice title=D1 backup skipped::CLOUDFLARE_API_TOKEN and/or CLOUDFLARE_ACCOUNT_ID are not configured."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.repository.private }}" != "true" ]; then
            echo "::warning title=D1 backup skipped::This repository is public, so Actions artifacts are not private. D1 dumps contain user data; make the repository private or use encrypted storage."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.config.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.config.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        if: steps.config.outputs.ready == 'true'
        run: npm ci

      - name: Export remote D1 database
        if: steps.config.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          STAMP="$(date -u +%Y-%m-%dT%H-%M-%SZ)"
          npx wrangler d1 export cuet-blueprint-db --remote --output "backup-${STAMP}.sql"

      - name: Upload private backup artifact
        if: steps.config.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: d1-backup-${{ github.run_id }}
          path: backup-*.sql
          retention-days: 30
          if-no-files-found: error

      - name: Explain skipped backup
        if: steps.config.outputs.ready != 'true'
        working-directory: .
        run: echo "No D1 dump was created. See the configuration notice above and docs/EXTERNAL_SETUP.md."
